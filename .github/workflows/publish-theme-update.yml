name: Publish new theme version
description: Creates a new release and provides the release to Juli's Kochbuch installations

on:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  read-theme-json:
    name: Read theme.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slug: ${{ steps.parse-theme-json.outputs.slug }}
      version: ${{ steps.parse-theme-json.outputs.version }}
      changed: ${{ steps.parse-theme-json.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Parse theme.json
        id: parse-theme-json
        uses: Juli-s-Kochbuch/github-actions/.github/actions/get-theme-meta-data@main

  create-release:
    name: Create Release
    needs: [ read-theme-json ]
    if: ${{ needs.read-theme-json.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.read-theme-json.outputs.version }}
          release_name: ${{ needs.read-theme-json.outputs.version }}
          draft: false
          prerelease: false

  build:
    name: Build
    needs: [ read-theme-json, create-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get install gh -y
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create zip
        run: git archive --prefix=${{ needs.read-theme-json.outputs.slug }}/ -o theme.zip HEAD -- 'theme.json' '*.css'
      - name: Upload zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.read-theme-json.outputs.version }} "theme.zip"
  
  create-update-json:
    name: Create update.json
    needs: [ read-theme-json ]
    if: ${{ needs.read-theme-json.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Directory
        run: |
          mkdir public
      - name: Create update.json
        run: |
          cat > public/update.json <<EOF
          {
            "version": "${{ needs.read-theme-json.outputs.version }}",
            "download_url": "https://github.com/${{ github.repository }}/releases/latest/download/theme.zip"
          }
          EOF
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public

  deploy:
    name: Deploy
    needs: [ read-theme-json, create-update-json, build ]
    if: ${{ needs.read-theme-json.outputs.changed == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - run: |
          echo update.json successfully updated: ${{ steps.deployment.outputs.page_url }}update.json
